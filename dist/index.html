<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a150b; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #2a150b; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
      background: radial-gradient(circle at 50% 38%, #6b3316 0%, #2a150b 65%); transition: opacity .5s; overflow: hidden; }
    #loader.done { opacity: 0; pointer-events: none; }
    .pan { position: relative; width: 150px; height: 150px; }
    .pan .dish { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff 0 52%, #e9ddd0 53% 70%, #fff 71%); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    .pan .food { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font-size: 64px; animation: flip 1.2s ease-in-out infinite; }
    @keyframes flip { 0%,100% { transform: translate(-50%,-50%) rotate(0); } 40% { transform: translate(-50%,-110%) rotate(180deg); } 60% { transform: translate(-50%,-50%) rotate(360deg); } }
    h1 { margin: 26px 0 4px; font-size: 56px; font-weight: 900; font-style: italic; letter-spacing: 2px; color: #ffc53d; text-shadow: 0 5px 0 #b3381b, 0 0 30px rgba(255,197,61,.4); }
    .tag { opacity: .8; font-weight: 800; letter-spacing: 3px; font-size: 13px; }
    .bar { width: 240px; height: 10px; border-radius: 10px; background: rgba(255,255,255,.16); margin-top: 28px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffc53d, #ff5a3c); transition: width .2s; border-radius: 10px; }
    #err { display: none; max-width: 320px; text-align: center; margin-top: 18px; font-size: 14px; opacity: .85; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="pan"><div class="dish"></div><div class="food">🍔</div></div>
    <h1>ORDER UP!</h1>
    <div class="tag">CHOP · COOK · SERVE</div>
    <div class="bar"><i id="fill"></i></div>
    <div id="err"></div>
  </div>
  <div id="toast" style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#fff;color:#2a150b;font-weight:800;padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none"></div>
  <script>
    // ---- Portal adapter: Poki / CrazyGames if present, otherwise a dev fallback that just grants rewards.
    (function () {
      var poki = function () { return window.PokiSDK; };
      var crazy = function () { return window.CrazyGames && window.CrazyGames.SDK; };
      window.ouToast = function (m) { var t = document.getElementById("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(window.__gt); window.__gt = setTimeout(function () { t.style.opacity = 0; }, 2000); };
      window.SD = {
        adsAvailable: function () { return !!(poki() || crazy()); },   // rewarded ads only where a portal SDK exists
        rewarded: function () {
          if (poki()) return poki().rewardedBreak().then(function (ok) { return !!ok; });
          if (crazy()) return new Promise(function (res) {
            crazy().ad.requestAd("rewarded", { adFinished: function () { res(true); }, adError: function () { res(false); } });
          });
          return new Promise(function (res) { setTimeout(function () { res(true); }, 400); }); // dev: instant reward
        },
        gameplay: function (on) {
          try { if (poki()) on ? poki().gameplayStart() : poki().gameplayStop(); } catch (e) {}
          try { if (crazy()) on ? crazy().game.gameplayStart() : crazy().game.gameplayStop(); } catch (e) {}
        },
        ready: function () {
          try { if (poki()) poki().gameLoadingFinished(); } catch (e) {}
          try { if (crazy()) crazy().game.loadingStop(); } catch (e) {}
        },
        track: function (name, value) {
          try { window.va && window.va("event", { name: name, data: { value: value } }); } catch (e) {}
        }
      };
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      ["gesturestart", "gesturechange", "contextmenu", "dblclick"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    })();

    (function () {
      var canvas = document.getElementById("unity-canvas"), loader = document.getElementById("loader");
      var fill = document.getElementById("fill"), err = document.getElementById("err");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/449c130ff79d70234ae5cabe0c7ac23d.data.unityweb",
        frameworkUrl: buildUrl + "/75c97936b45f28eb40337c43b813a524.framework.js.unityweb",
        codeUrl: buildUrl + "/85cf388f3edcd607ac6777635fb490b3.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        autoSyncPersistentDataPath: true,
        companyName: "OrderUp",
        productName: "Order Up",
        productVersion: "1.0.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") { err.style.display = "block"; err.textContent = msg; } console.warn(msg); }
      };
      var s = document.createElement("script");
      s.src = buildUrl + "/d79e70fd30bb63112d18f613b113025f.loader.js";
      s.onload = function () {
        try { window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
        createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(8 + p * 92) + "%"; })
          .then(function (inst) { window.unityInstance = inst; window.kitchen && window.kitchen.ready();
            document.addEventListener("visibilitychange", function () { if (document.hidden) { try { inst.SendMessage("Game", "Persist"); } catch (e) {} } });
            window.addEventListener("pagehide", function () { try { inst.SendMessage("Game", "Persist"); } catch (e) {} }); fill.style.width = "100%"; setTimeout(function () { loader.classList.add("done"); canvas.focus(); }, 300); })
          .catch(function (m) { err.style.display = "block"; err.textContent = "Couldn't start: " + m; });
      };
      document.body.appendChild(s);
    })();
  </script>
  <script src="kitchen.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
