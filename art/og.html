<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:#2a150b}
.shot{position:absolute;inset:0;background:url(shot.png) 70% 45%/135% no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(42,21,11,.97) 0%,rgba(42,21,11,.88) 36%,rgba(42,21,11,.2) 64%,transparent 100%)}
.txt{position:absolute;left:62px;top:58px;width:640px}
h1{margin:0;font-size:124px;line-height:.9;font-weight:900;font-style:italic;letter-spacing:1px;color:#ffc53d;text-shadow:0 9px 0 #b3381b,0 0 40px rgba(255,197,61,.35)}
p{margin:30px 0 0;font-size:31px;font-weight:700;opacity:.95;line-height:1.3}
.chips{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:20px;font-weight:900;letter-spacing:1px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.cta{display:inline-block;margin-top:26px;background:#ff5a3c;color:#fff;font-weight:900;font-size:30px;padding:16px 36px;border-radius:18px;box-shadow:0 7px 0 #a8321b}
.dish{position:absolute;width:150px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.5))}
</style></head><body>
<div class="shot"></div><div class="shade"></div>
<img class="dish" src="burger-cheese.png" style="left:560px;top:380px;width:190px;transform:rotate(-8deg)">
<div class="txt">
  <h1>ORDER<br>UP!</h1>
  <p>Chop, cook &amp; serve with friends online.</p>
  <div class="chips"><span class="chip">CO-OP UP TO 4</span><span class="chip">SOLO</span><span class="chip">2 KITCHENS</span><span class="chip">LEADERBOARDS</span></div>
  <div class="cta">COOK NOW &#8594;</div>
</div>
</body></html>
